<!doctype html>
<html><head><meta charset="utf-8"><title>Setting auth…</title></head>
<body><script>
const p = new URLSearchParams(location.search);
const token = p.get('token');
const user = p.get('user');
const to = p.get('to') || '/dashboard';
if (token) localStorage.setItem('token', token);
if (user) try { localStorage.setItem('user', atob(user)); } catch(e) {}
location.replace(to);
</script></body></html>
