name: lint

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pint:
    name: PHP — Laravel Pint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: job-backoffice
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', tools: composer:v2 }
      - uses: actions/cache@v4
        with:
          path: job-backoffice/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('job-backoffice/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      # --test mode only reports differences and exits non-zero on issues,
      # so PRs can't merge unformatted code.
      - run: ./vendor/bin/pint --test

  eslint:
    name: JS — ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: job-app-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: job-app-frontend/package-lock.json
      - run: npm ci
      # Skip silently if no ESLint script is configured. Without this guard
      # `npm run lint` would fail with "missing script: lint".
      - run: |
          if jq -e '.scripts.lint' package.json > /dev/null; then
            npm run lint
          else
            echo "::notice::No 'lint' script in package.json, skipping ESLint"
          fi
