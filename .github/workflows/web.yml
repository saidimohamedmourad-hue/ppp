name: web

on:
  push:
    branches: [main, develop]
    paths:
      - 'job-app-frontend/**'
      - 'job-backoffice/**'  # E2E tests hit the API, so a backend change matters
      - 'job-shared/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'job-app-frontend/**'
      - 'job-backoffice/**'
      - 'job-shared/**'
      - '.github/workflows/web.yml'

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: job-app-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: job-app-frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    name: Vite build
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: job-app-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: job-app-frontend/package-lock.json
      - run: npm ci
      # Build with placeholder env values so the bundle compiles. Real values
      # are injected at deploy time, never baked in CI.
      - run: |
          cp .env.example .env
          npm run build

  e2e:
    name: Playwright E2E
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The E2E spec drives the real Laravel + Vite stack, so we need both up.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: iqra_test
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      # ─── Backend setup ───
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, mysql, gd, zip, bcmath, intl
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: job-backoffice/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('job-backoffice/composer.lock') }}

      - name: Install backend deps
        working-directory: job-backoffice
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Configure backend .env (CI)
        working-directory: job-backoffice
        run: |
          cp .env.example .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=iqra_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          # MAIL_MAILER=log keeps the forgot-password E2E flow fast (no SMTP).
          sed -i 's|^MAIL_MAILER=.*|MAIL_MAILER=log|' .env
          # Disable Turnstile in CI by clearing the secret — backend skips
          # token verification when the secret is empty.
          sed -i 's/^TURNSTILE_SITE_KEY=.*//' .env
          sed -i 's/^TURNSTILE_SECRET=.*//' .env
          php artisan key:generate

      - name: Wait for MariaDB
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uroot -proot --silent && exit 0
            sleep 2
          done
          exit 1

      - name: Migrate + seed a test user
        working-directory: job-backoffice
        run: |
          php artisan migrate --force --no-interaction
          # The Playwright tests log in as exemple@exemple.com — create them.
          php artisan tinker --execute="
            \$u = App\Models\User::firstOrCreate(
              ['email' => 'exemple@exemple.com'],
              ['name' => 'exemple', 'password' => bcrypt('password12345678'), 'role' => 'job-seeker']
            );
            echo 'seeded user: '.\$u->email;
          "

      - name: Start Laravel server
        working-directory: job-backoffice
        # nohup so the server keeps running after this step finishes; we kill
        # it explicitly at the end.
        run: |
          nohup php artisan serve --host=127.0.0.1 --port=8000 > laravel.log 2>&1 &
          for i in {1..30}; do
            curl -s http://127.0.0.1:8000 > /dev/null && exit 0
            sleep 1
          done
          echo "Laravel never came up"; cat laravel.log; exit 1

      # ─── Frontend setup ───
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: job-app-frontend/package-lock.json

      - name: Install frontend deps
        working-directory: job-app-frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: job-app-frontend
        run: npx playwright install --with-deps chromium

      - name: Configure frontend .env (CI)
        working-directory: job-app-frontend
        # Empty env so providers gracefully no-op (the Google + Facebook
        # buttons are conditionally rendered).
        run: |
          cp .env.example .env

      - name: Start Vite dev server
        working-directory: job-app-frontend
        run: |
          nohup npm run dev -- --port 3000 --strictPort > vite.log 2>&1 &
          for i in {1..30}; do
            curl -s http://localhost:3000 > /dev/null && exit 0
            sleep 1
          done
          echo "Vite never came up"; cat vite.log; exit 1

      - name: Run Playwright suite
        working-directory: job-app-frontend
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: job-app-frontend/playwright-report/
          retention-days: 7
